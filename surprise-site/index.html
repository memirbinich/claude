          <button class="key" data-k="9">9</button>
          <button class="key key--wide" data-k="del" aria-label="Sil">←</button>
          <button class="key" data-k="0">0</button>
          <button class="key key--wide" data-k="clr" aria-label="Temizle">×</button>
        </div>
        <p class="lock__msg" id="lockMsg" role="alert"></p>
      </div>
    </div>
  </section>

  <!-- ═══ 2 · SÜRPRİZ ═══ -->
  <section class="screen" id="s-reveal">
    <div class="reveal">
      <svg class="mascot is-happy" viewBox="0 0 200 210" aria-hidden="true">
        <ellipse class="m-shade" cx="100" cy="197" rx="52" ry="8"/>
        <path class="m-body" d="M100 14c-42 0-70 34-70 84 0 56 30 88 70 88s70-32 70-88c0-50-28-84-70-84z"/>
        <circle class="m-blush" cx="56" cy="112" r="11"/>
        <circle class="m-blush" cx="144" cy="112" r="11"/>
        <g class="m-eyes-happy" style="display:block">
          <path d="M69 100c3-6 11-6 14 0" fill="none" style="stroke:var(--ink);stroke-width:3.4;stroke-linecap:round"/>
          <path d="M117 100c3-6 11-6 14 0" fill="none" style="stroke:var(--ink);stroke-width:3.4;stroke-linecap:round"/>
          <path d="M88 118c5 8 19 8 24 0" fill="none" style="stroke:var(--ink);stroke-width:3.2;stroke-linecap:round"/>
        </g>
      </svg>
      <h1 class="display reveal__title">doğru bildin, <em id="revealName">sen</em></h1>
      <p class="reveal__sub">buradan sonrası tamamen senin için hazırlandı.</p>
      <button class="btn" data-go="s-letter">aç</button>
    </div>
  </section>

  <!-- ═══ 3 · MEKTUP ═══ -->
  <section class="screen" id="s-letter">
    <div style="display:grid; justify-items:center; gap:1.5rem; width:min(620px,100%)">
      <article class="letter">
        <svg class="bloom bloom--tl" viewBox="0 0 120 120" aria-hidden="true">
          <path class="leaf" d="M60 66C40 74 22 96 16 118c24-4 42-22 50-44z"/>
          <path class="leaf" d="M62 64c22 4 44 22 52 42-24 2-46-14-56-36z"/>
          <circle class="petal" cx="60" cy="24" r="17"/>
          <circle class="petal" cx="36" cy="44" r="15"/>
          <circle class="petal" cx="84" cy="44" r="15"/>
          <circle class="petal-2" cx="46" cy="66" r="13"/>
          <circle class="petal-2" cx="74" cy="66" r="13"/>
          <circle class="core" cx="60" cy="47" r="10"/>
        </svg>
        <div class="letter__inner">
          <h2 class="letter__to" id="letterTo">Sevgili —,</h2>
          <div id="letterBody"></div>
          <p class="letter__sign" id="letterSign">—</p>
        </div>
        <svg class="bloom bloom--br" viewBox="0 0 120 120" aria-hidden="true">
          <path class="leaf" d="M60 66C40 74 22 96 16 118c24-4 42-22 50-44z"/>
          <path class="leaf" d="M62 64c22 4 44 22 52 42-24 2-46-14-56-36z"/>
          <circle class="petal" cx="60" cy="24" r="17"/>
          <circle class="petal" cx="36" cy="44" r="15"/>
          <circle class="petal" cx="84" cy="44" r="15"/>
          <circle class="petal-2" cx="46" cy="66" r="13"/>
          <circle class="petal-2" cx="74" cy="66" r="13"/>
          <circle class="core" cx="60" cy="47" r="10"/>
        </svg>
      </article>
      <div class="nav">
        <button class="btn-quiet" data-go="s-reveal">geri</button>
        <button class="btn" data-go="s-song">devam</button>
      </div>
    </div>
  </section>

  <!-- ═══ 4 · ŞARKI ═══ -->
  <section class="screen" id="s-song">
    <div class="song">
      <div class="frame" id="frame">
        <div class="frame__ph">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" aria-hidden="true"
               style="stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round">
            <rect x="3" y="4" width="18" height="16" rx="2.5"/>
            <circle cx="8.5" cy="9.5" r="1.6"/>
            <path d="M21 16l-5-5-6 6-2-2-5 5"/>
          </svg>
          <span>buraya fotoğrafınızı ekleyin<br>(CONFIG içindeki <b>foto</b> alanı)</span>
        </div>
        <div class="frame__lyrics" id="lyrics"></div>
      </div>

      <div class="player">
        <div class="player__meta">
          <div>
            <p class="player__name" id="songName">—</p>
            <p class="player__by" id="songBy">—</p>
          </div>
        </div>
        <div class="track"><div class="track__fill" id="trackFill"></div></div>
        <div class="player__row">
          <span class="time" id="tNow">0:00</span>
          <button class="playbtn playing" id="playBtn" aria-label="Duraklat">
            <svg class="ico-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
            <svg class="ico-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
          </button>
          <span class="time" id="tEnd">0:00</span>
        </div>
      </div>

      <div class="nav">
        <button class="btn-quiet" data-go="s-letter">geri</button>
        <button class="btn" data-go="s-finale">son</button>
      </div>
    </div>
  </section>

  <!-- ═══ 5 · KALP ═══ -->
  <section class="screen" id="s-finale">
    <div class="finale">
      <svg class="heart" viewBox="0 0 100 90" aria-hidden="true">
        <path d="M50 88C22 68 4 51 4 30.5 4 15 16 4 30 4c8 0 15.5 4 20 10.5C54.5 8 62 4 70 4c14 0 26 11 26 26.5C96 51 78 68 50 88z"/>
      </svg>
      <p class="display finale__word" id="finalWord">—</p>
      <div class="nav">
        <button class="btn-quiet" data-go="s-song">geri</button>
        <button class="btn-quiet" id="lockAgain">baştan kilitle</button>
      </div>
    </div>
  </section>
</div>

<script>
(function () {
  "use strict";

  const $  = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));

  /* ── İçeriği yerleştir ─────────────────────────────────── */
  $("#hintText").textContent   = CONFIG.ipucu;
  $("#revealName").textContent = CONFIG.isim;
  $("#letterTo").textContent   = "Sevgili " + CONFIG.isim + ",";
  $("#letterSign").textContent = CONFIG.imza;
  $("#songName").textContent   = CONFIG.sarkiAdi;
  $("#songBy").textContent     = CONFIG.sanatci;
  $("#finalWord").textContent  = CONFIG.sonSoz;

  const body = $("#letterBody");
  CONFIG.mektup.forEach(t => {
    const p = document.createElement("p");
    p.className = "line";
    p.textContent = t;
    body.appendChild(p);
  });

  const lyricsBox = $("#lyrics");
  CONFIG.sozler.forEach(t => {
    const p = document.createElement("p");
    p.className = "lyric";
    p.textContent = t;
    lyricsBox.appendChild(p);
  });

  if (CONFIG.foto) {
    const f = $("#frame");
    f.style.backgroundImage = "url('" + CONFIG.foto + "')";
    f.classList.add("has-photo");
  }

  const fmt = s => Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0");
  $("#tEnd").textContent = fmt(CONFIG.sarkiSuresi);

  /* ── Sahne geçişi ──────────────────────────────────────── */
  let current = "s-lock";
  function go(id) {
    if (id === current) return;
    $("#" + current).classList.remove("is-active");
    $("#" + id).classList.add("is-active");
    current = id;
    window.scrollTo({ top: 0, behavior: "instant" });
    $("#petals").classList.toggle("on", id === "s-reveal" || id === "s-finale");
    if (id === "s-song") startSong();
    else stopSong();
  }
  $$("[data-go]").forEach(b => b.addEventListener("click", () => go(b.dataset.go)));

  /* ── Kilit ─────────────────────────────────────────────── */
  const dots    = $$("#dots .dot");
  const msg     = $("#lockMsg");
  const card    = $("#lockCard");
  const mascot  = $("#mascot");
  let entry = "";
  let busy  = false;

  function paint() {
    dots.forEach((d, i) => {
      const has = i < entry.length;
      d.classList.toggle("filled", has);
      d.textContent = has ? "•" : "";
    });
  }

  function press(k) {
    if (busy) return;
    if (k === "del") { entry = entry.slice(0, -1); msg.textContent = ""; return paint(); }
    if (k === "clr") { entry = ""; msg.textContent = ""; return paint(); }
    if (entry.length >= 4) return;
    entry += k;
    msg.textContent = "";
    mascot.classList.remove("is-sad");
    paint();
    if (entry.length === 4) setTimeout(check, 260);
  }

  function check() {
    if (entry === String(CONFIG.sifre)) {
      busy = true;
      msg.textContent = "";
      mascot.classList.add("is-happy");
      setTimeout(() => { go("s-reveal"); busy = false; }, 700);
    } else {
      busy = true;
      card.classList.add("shake");
      mascot.classList.add("is-sad");
      msg.textContent = "o değil. bir daha dene.";
      setTimeout(() => {
        card.classList.remove("shake");
        entry = "";
        paint();
        busy = false;
      }, 620);
    }
  }

  $("#keypad").addEventListener("click", e => {
    const b = e.target.closest("[data-k]");
    if (b) press(b.dataset.k);
  });

  document.addEventListener("keydown", e => {
    if (current !== "s-lock") return;
    if (/^[0-9]$/.test(e.key)) press(e.key);
    else if (e.key === "Backspace") press("del");
    else if (e.key === "Escape") press("clr");
  });

  $("#lockAgain").addEventListener("click", () => {
    entry = "";
    paint();
    msg.textContent = "";
    mascot.classList.remove("is-sad", "is-happy");
    go("s-lock");
  });

  paint();

  /* ── Şarkı ─────────────────────────────────────────────── */
  const fill    = $("#trackFill");
  const tNow    = $("#tNow");
  const playBtn = $("#playBtn");
  const lyrics  = $$(".lyric");
  let t = 0, timer = null, playing = true;

  function tick() {
    if (!playing) return;
    t = (t + .25) % CONFIG.sarkiSuresi;
    fill.style.width = (t / CONFIG.sarkiSuresi * 100) + "%";
    tNow.textContent = fmt(t);
    const step = CONFIG.sarkiSuresi / (lyrics.length + 1);
    lyrics.forEach((l, i) => l.classList.toggle("in", t > step * (i + .35)));
  }
  function startSong() {
    if (timer) return;
    timer = setInterval(tick, 250);
  }
  function stopSong() {
    clearInterval(timer);
    timer = null;
  }
  playBtn.addEventListener("click", () => {
    playing = !playing;
    playBtn.classList.toggle("playing", playing);
    playBtn.setAttribute("aria-label", playing ? "Duraklat" : "Çal");
  });

  /* ── Yaprak yağmuru ────────────────────────────────────── */
  const cv  = $("#petals");
  const ctx = cv.getContext("2d");
  const calm = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let W = 0, H = 0, drops = [];

  function size() {
    const r = Math.min(window.devicePixelRatio || 1, 2);
    W = cv.width  = Math.floor(innerWidth  * r);
    H = cv.height = Math.floor(innerHeight * r);
    cv.style.width  = innerWidth + "px";
    cv.style.height = innerHeight + "px";
    ctx.setTransform(r, 0, 0, r, 0, 0);
  }

  function seed() {
    const n = calm ? 0 : Math.round(innerWidth / 34);
    drops = Array.from({ length: n }, () => ({
      x: Math.random() * innerWidth,
      y: Math.random() * innerHeight - innerHeight,
      r: 4 + Math.random() * 7,
      vy: .25 + Math.random() * .55,
      sway: .3 + Math.random() * .8,
      ph: Math.random() * Math.PI * 2,
      rot: Math.random() * Math.PI,
      vr: (Math.random() - .5) * .012,
      a: .18 + Math.random() * .32
    }));
  }

  function petalColor() {
    return getComputedStyle(document.documentElement).getPropertyValue("--rose").trim() || "#D4547A";
  }

  function frame() {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    const col = petalColor();
    drops.forEach(p => {
      p.y += p.vy;
      p.ph += .012;
      p.rot += p.vr;
      p.x += Math.sin(p.ph) * p.sway;
      if (p.y > innerHeight + 20) { p.y = -20; p.x = Math.random() * innerWidth; }
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.globalAlpha = p.a;
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.ellipse(0, 0, p.r, p.r * .58, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    });
    requestAnimationFrame(frame);
  }

  size(); seed();
  addEventListener("resize", () => { size(); seed(); });
  if (!calm) requestAnimationFrame(frame);
})();
</script>
